name: Build (Make)
on:
    workflow_dispatch:
    pull_request:

jobs:
    compile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install -y make
                  npm install
            - run: make compile
