name: Build (Make)
on:
    workflow_dispatch:
    pull_request:

jobs:
    compile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install -y make
                  npm install typescript@5.7.3
            - name: Add node_modules to PATH
              run: echo "${{ github.workspace }}/node_modules/.bin:$PATH" >> $GITHUB_PATH
            - run: make compile
