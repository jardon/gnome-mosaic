name: Build (Make)
on:
    workflow_dispatch:
    pull_request:

jobs:
    compile:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Install dependencies
              run: |
                  sudo apt update
                  sudo apt install -y make
                  npm install typescript@latest
            - run: make compile
